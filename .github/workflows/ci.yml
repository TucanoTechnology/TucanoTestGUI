name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      # The suite and the bundle need the application source. While `src/` is
      # absent (the GUI v2 reset, #102) there is nothing to run, so these steps
      # are keyed on its presence: they skip with a warning now and re-arm by
      # themselves as soon as the rebuild lands the new source tree.
      - name: Note the absent application source
        if: ${{ hashFiles('src/**') == '' }}
        run: |
          echo "::warning::src/ is absent (GUI v2 reset, #102) — unit/accessibility tests and the production bundle are skipped until the rebuild lands src/."
      - name: Run unit and accessibility tests
        if: ${{ hashFiles('src/**') != '' }}
        run: npm test
      - name: Build production bundle
        if: ${{ hashFiles('src/**') != '' }}
        run: npm run build

  # The browser half of the WCAG gate (#123): axe with colour-contrast live,
  # and the keyboard journeys. Unit axe cannot compute contrast without a
  # renderer (the README gap), so this job is the one that really checks the
  # palette; it builds the app and runs it against the recorded fixtures.
  e2e:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The build happens on the host toolchain; the browser suite runs in
      # the image Playwright pins its browsers to (matching the @playwright/test
      # version), so no apt-get is needed on the Fedora runners and the
      # container only ever executes Node built-ins plus the mounted CLI.
      - name: Build the bundle
        run: npm run build
      - name: Browser accessibility and keyboard suite
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            npx playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  client-drift:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Drift can only be judged against a committed client. Both steps return
      # with `src/api/generated` (the GUI v2 reset, #102).
      - name: Note the absent generated client
        if: ${{ hashFiles('src/api/generated/**') == '' }}
        run: |
          echo "::warning::src/api/generated is absent (GUI v2 reset, #102) — contract drift cannot be judged until the client is regenerated."
      - name: Regenerate the API client from the pinned contract
        if: ${{ hashFiles('src/api/generated/**') != '' }}
        run: npm run generate:client
      - name: Fail if the committed client is stale
        if: ${{ hashFiles('src/api/generated/**') != '' }}
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --short -- src/api/generated
            echo "::error::src/api/generated is out of date with api/openapi.json. Run 'npm run generate:client' and commit the result."
            exit 1
          fi

  container:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      # `Dockerfile` copies `src/` to build the bundle, so a source-less tree has
      # no image to build or scan (the GUI v2 reset, #102).
      - name: Note the absent application source
        if: ${{ hashFiles('src/**') == '' }}
        run: |
          echo "::warning::src/ is absent (GUI v2 reset, #102) — the image build and its vulnerability scan are skipped until the rebuild lands src/."
      - name: Build application image
        if: ${{ hashFiles('src/**') != '' }}
        run: docker build --pull --build-arg CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }} --file Dockerfile --tag tucano-test-gui .
      - uses: aquasecurity/trivy-action@v0.36.0
        if: ${{ hashFiles('src/**') != '' }}
        with:
          image-ref: tucano-test-gui
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
