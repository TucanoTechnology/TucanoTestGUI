name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run unit and accessibility tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  client-drift:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate the API client from the pinned contract
        run: npm run generate:client
      - name: Fail if the committed client is stale
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --short -- src/api/generated
            echo "::error::src/api/generated is out of date with api/openapi.json. Run 'npm run generate:client' and commit the result."
            exit 1
          fi

  container:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build --pull --build-arg CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }} --file Dockerfile --tag tucano-test-gui .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tucano-test-gui
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
