name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run unit and accessibility tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  container:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build --file Dockerfile --tag tucano-test-gui .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tucano-test-gui
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
