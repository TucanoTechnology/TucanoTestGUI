name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.9.0 detect --source /repo --no-git --redact

  container-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      # `Dockerfile` copies `src/` to build the bundle, so a source-less tree has
      # no image to scan (the GUI v2 reset, #102). The guard re-arms by itself
      # once the rebuild lands the new source tree.
      - name: Note the absent application source
        if: ${{ hashFiles('src/**') == '' }}
        run: echo "::warning::src/ is absent (GUI v2 reset, #102) — the image build and its vulnerability scan are skipped until the rebuild lands src/."
      - name: Build application image
        if: ${{ hashFiles('src/**') != '' }}
        run: docker build --pull --build-arg CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }} --file Dockerfile --tag tucano-test-gui .
      - uses: aquasecurity/trivy-action@v0.36.0
        if: ${{ hashFiles('src/**') != '' }}
        with:
          image-ref: tucano-test-gui
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
